<div xmlns="http://www.w3.org/1999/xhtml"
     style="font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; color: #1a1a1a;
            padding: 1em 1.2em; width: 100%; max-width: 100%; box-sizing: border-box;
            font-size: 13px; line-height: 1.45;">
  <style>
    .dt-wrap { width: 100%; max-width: 46em; box-sizing: border-box; }
    .dt-section { background: #fafafa; border: 1px solid #e4e4e4; border-radius: 6px;
                  padding: 0.9em 1.1em; margin-bottom: 1em; box-sizing: border-box; }
    .dt-section h2 { font-size: 1.15em; font-weight: 600; margin: 0 0 0.25em; color: #222; }
    .dt-section > p { font-size: 0.92em; color: #888; margin: 0 0 0.8em; }
    .dt-field { margin: 0.55em 0; }
    .dt-field > label { display: block; margin-bottom: 0.3em; color: #444; font-size: 0.92em; }
    .dt-field input { display: block; width: 100%; max-width: 100%; box-sizing: border-box;
                      padding: 0.45em 0.7em; border: 1px solid #c0c0c0; border-radius: 4px;
                      font: inherit; background: #fff; color: #1a1a1a; }
    .dt-field input[type="number"] { max-width: 12em; }
    .dt-note { color: #999; font-size: 0.85em; margin-top: 0.25em; }
    .dt-btn { padding: 0.4em 1.1em; border: 1px solid #b9b9b9; border-radius: 4px;
              background: #f5f5f5; color: #1a1a1a; font: inherit; cursor: pointer; }
    .dt-btn:hover { background: #ececec; }
    .dt-btn:disabled { opacity: .6; cursor: default; }
    .dt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em; margin-top: 0.9em; }
    .dt-result { font-size: 0.9em; }
    .dt-link { border: none; background: none; padding: 0; margin: 0.3em 0 0;
               color: #0b5cd5; font: inherit; font-size: 0.88em; cursor: pointer;
               text-decoration: none; }
    .dt-link:hover { text-decoration: underline; }
    .dt-detail { font-size: 0.85em; color: #666; line-height: 1.6; margin-top: 0.4em; word-break: break-word; }
    @media (max-width: 480px) {
      .dt-field input[type="number"] { max-width: 100%; }
    }
  </style>

  <div class="dt-wrap">

    <div class="dt-section">
      <h2>运行环境</h2>
      <p>插件已内置翻译助手（无需 Python）。只需指向本机 DocuTranslate 本体；留空会尝试自动探测。</p>
      <div class="dt-row" style="margin-top: 0;">
        <button id="dt-probe" type="button" class="dt-btn">自动探测本机环境</button>
        <span id="dt-probe-result" class="dt-result"></span>
      </div>
      <div class="dt-field">
        <label for="dt-serviceExe">DocuTranslate 程序路径（docutranslate.exe）</label>
        <input id="dt-serviceExe" placeholder="例如 C:\...\envs\docutranslate\Scripts\docutranslate.exe"/>
      </div>
      <div class="dt-field">
        <label for="dt-serviceCwd">DocuTranslate 工作目录</label>
        <input id="dt-serviceCwd" placeholder="可选，例如 D:\docutranslate"/>
        <div class="dt-note">服务未运行时，插件会用上面的程序路径自动启动它。</div>
      </div>
      <div class="dt-field">
        <label for="dt-edgePath">浏览器路径（用于把译文打印成 PDF，Edge/Chrome 均可）</label>
        <input id="dt-edgePath" placeholder="留空自动探测 Edge 或 Chrome"/>
      </div>
    </div>

    <div class="dt-section">
      <h2>翻译服务</h2>
      <p>右键文献条目即可翻译；修改后自动保存。</p>
      <div class="dt-field">
        <label for="dt-apiKey">API Key</label>
        <input id="dt-apiKey" type="password" autocomplete="off"/>
        <button id="dt-link-sensenova" type="button" class="dt-link">没有 Key？前往 SenseNova 平台注册获取 ↗</button>
      </div>
      <div class="dt-field">
        <label for="dt-baseUrl">API 地址</label>
        <input id="dt-baseUrl" placeholder="https://host/v1"/>
      </div>
      <div class="dt-field">
        <label for="dt-modelId">模型 ID</label>
        <input id="dt-modelId"/>
      </div>
      <div class="dt-field">
        <label for="dt-toLang">翻译目标语言</label>
        <input id="dt-toLang"/>
      </div>
      <div class="dt-row">
        <button id="dt-test" type="button" class="dt-btn">测试连接</button>
        <span id="dt-test-result" class="dt-result"></span>
      </div>
      <div id="dt-test-detail" class="dt-detail"></div>
    </div>

    <div class="dt-section">
      <h2>PDF 解析（MinerU）</h2>
      <p>解析 PDF 时的 MinerU 服务凭据与并发参数。</p>
      <div class="dt-field">
        <label for="dt-mineruToken">MinerU Token</label>
        <input id="dt-mineruToken" type="password" autocomplete="off"/>
        <button id="dt-link-mineru" type="button" class="dt-link">没有 Token？前往 MinerU 注册获取 ↗</button>
      </div>
      <div class="dt-field">
        <label for="dt-chunkSize">分块大小</label>
        <input id="dt-chunkSize" type="number"/>
      </div>
      <div class="dt-field">
        <label for="dt-concurrent">并发数</label>
        <input id="dt-concurrent" type="number"/>
      </div>
    </div>

  </div>
</div>
