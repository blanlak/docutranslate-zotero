<div style="display:flex;flex-direction:column;gap:12px;padding:8px 4px;max-width:720px;font-size:13px;">
  <div style="background:#fafafa;border:1px solid #e4e4e4;border-radius:6px;padding:12px 16px;margin-bottom:4px;">
    <div style="font-weight:600;font-size:14px;margin-bottom:2px;">DocuTranslate 翻译设置</div>
    <div style="color:#888;font-size:12px;margin-bottom:8px;">右键文献条目即可翻译；修改后自动保存。</div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">API Key</label>
      <input id="dt-apiKey" type="password" style="flex:1;padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;min-width:280px;" autocomplete="off"/>
    </div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">API 地址</label>
      <input id="dt-baseUrl" style="flex:1;padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;min-width:280px;"/>
    </div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">模型 ID</label>
      <input id="dt-modelId" style="flex:1;padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;min-width:280px;"/>
    </div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">翻译目标语言</label>
      <input id="dt-toLang" style="flex:1;padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;min-width:280px;"/>
    </div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">思考模式</label>
      <input id="dt-thinking" style="flex:1;padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;min-width:280px;"/>
    </div>
  </div>
  <div style="background:#fafafa;border:1px solid #e4e4e4;border-radius:6px;padding:12px 16px;margin-bottom:4px;">
    <div style="font-weight:600;font-size:14px;margin-bottom:2px;">PDF 解析（MinerU）</div>
    <div style="color:#888;font-size:12px;margin-bottom:8px;">解析 PDF 时的识别参数。</div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">MinerU Token</label>
      <input id="dt-mineruToken" type="password" style="flex:1;padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;min-width:280px;" autocomplete="off"/>
    </div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">分块大小</label>
      <input id="dt-chunkSize" type="number" style="padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;max-width:140px;"/>
    </div>
    <div style="display:flex;align-items:center;margin:6px 0;">
      <label style="width:130px;color:#555;flex:0 0 130px;">并发数</label>
      <input id="dt-concurrent" type="number" style="padding:4px 8px;border:1px solid #c0c0c0;border-radius:3px;max-width:140px;"/>
    </div>
  </div>
</div>
