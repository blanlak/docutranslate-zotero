<div xmlns="http://www.w3.org/1999/xhtml" xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
  <xul:vbox class="main-section">
    <groupbox>
      <label><html:h2>翻译服务</html:h2></label>
      <description value="调用本机 DocuTranslate 服务所需的配置。右键文献条目即可翻译。"/>

      <hbox align="center" style="padding: 2px 0;">
        <label value="API Key" control="dt-apiKey" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-apiKey" type="password" style="width: 450px; min-width: 450px;"/>
      </hbox>
      <hbox align="center" style="padding: 2px 0;">
        <label value="API 地址" control="dt-baseUrl" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-baseUrl" style="width: 450px; min-width: 450px;"/>
      </hbox>
      <hbox align="center" style="padding: 2px 0;">
        <label value="模型 ID" control="dt-modelId" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-modelId" style="width: 450px; min-width: 450px;"/>
      </hbox>
      <hbox align="center" style="padding: 2px 0;">
        <label value="翻译目标语言" control="dt-toLang" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-toLang" style="width: 450px; min-width: 450px;"/>
      </hbox>
      <hbox align="center" style="padding: 2px 0;">
        <label value="思考模式" control="dt-thinking" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-thinking" style="width: 450px; min-width: 450px;"/>
      </hbox>
    </groupbox>

    <groupbox>
      <label><html:h2>PDF 解析（MinerU）</html:h2></label>
      <description value="解析 PDF 时的 MinerU 服务凭据与并发参数。"/>

      <hbox align="center" style="padding: 2px 0;">
        <label value="MinerU Token" control="dt-mineruToken" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-mineruToken" type="password" style="width: 450px; min-width: 450px;"/>
      </hbox>
      <hbox align="center" style="padding: 2px 0;">
        <label value="分块大小" control="dt-chunkSize" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-chunkSize" type="number" style="width: 200px; min-width: 200px;"/>
      </hbox>
      <hbox align="center" style="padding: 2px 0;">
        <label value="并发数" control="dt-concurrent" style="width: 130px; min-width: 130px;"/>
        <textbox id="dt-concurrent" type="number" style="width: 200px; min-width: 200px;"/>
      </hbox>
    </groupbox>
  </xul:vbox>
</div>
